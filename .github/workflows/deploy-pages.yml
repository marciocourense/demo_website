# Requires: Repo → Settings → Pages → Source = "GitHub Actions" (save once).
# Without that, Pages API returns 404 and deploy steps cannot run.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Omit configure-pages: it calls GET /repos/.../pages which 404s until Pages is enabled in repo settings.

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          include-hidden-files: true

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
